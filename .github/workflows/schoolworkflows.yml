name: Build and Deploy .NET Framework 4.8

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-2025

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # Restore
    - name: Restore Packages
      shell: powershell
      run: nuget restore SchoolERP_System.sln -Verbosity detailed

    # Verify Crystal Packages
    - name: Verify Packages
      shell: powershell
      run: |
        if (Test-Path ".\packages") {
          Get-ChildItem .\packages -Recurse | Where-Object { $_.Name -like "*Crystal*" }
        }

    # Combined Build & Publish (FIXED: Uses the Solution with explicit pipeline targets)
    - name: Build and Publish Solution
      shell: powershell
      run: |
        msbuild "SchoolERP_System.sln" /p:Configuration=Release /p:Platform="Any CPU" /t:Clean,Build /p:DeployOnBuild=true /p:DeployTarget=WebPublish /p:WebPublishMethod=FileSystem /p:DeleteExistingFiles=True /p:publishUrl="${{ github.workspace }}\publish"

    # Verify output
    - name: Show Published Files
      shell: powershell
      run: |
        if (Test-Path "${{ github.workspace }}\publish") {
          Get-ChildItem -Recurse "${{ github.workspace }}\publish"
        } else {
          Write-Error "Publish directory does not exist!"
          exit 1
        }

    # Deploy FTP
    - name: Deploy to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /wwwroot/gitaction/
