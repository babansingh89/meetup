name: Build and Deploy .NET Framework 4.8

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # ✅ Fix Node.js deprecation

jobs:
  build-and-deploy:
    runs-on: windows-2025  # ✅ Fix windows-latest deprecation

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # ✅ Fix Step 5 - correct .sln path
    - name: Restore Packages
      run: nuget restore SchoolERP_System\SchoolERP_System.sln
      shell: powershell

    - name: Build Solution
      run: |
        msbuild SchoolERP_System\SchoolERP_System.sln `
          /p:Configuration=Release `
          /p:Platform="Any CPU"
      shell: powershell

    - name: Publish Website
      run: |
        msbuild SchoolERP_System\SchoolERP_System.csproj `
          /p:Configuration=Release `
          /p:DeployOnBuild=true `
          /p:WebPublishMethod=FileSystem `
          /p:DeleteExistingFiles=True `
          /p:publishUrl="${{ github.workspace }}\publish"
      shell: powershell

    - name: Show Published Files
      run: Get-ChildItem -Recurse "${{ github.workspace }}\publish"
      shell: powershell

    - name: Verify Publish Output
      run: |
        if (!(Test-Path "${{ github.workspace }}\publish")) {
          Write-Host "Publish folder not found!"
          exit 1
        }
        $files = Get-ChildItem "${{ github.workspace }}\publish" -Recurse
        Write-Host "Total files published: $($files.Count)"
      shell: powershell

    - name: Deploy to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /wwwroot/gitaction/
        timeout: 60000
        log-level: verbose
