name: Build and Deploy .NET Framework 4.8

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      # Checkout source
      - name: Checkout Code
        uses: actions/checkout@v4

      # Setup NuGet
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # Setup MSBuild
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Restore NuGet packages
      - name: Restore Packages
        run: nuget restore SchoolERP_System.sln

      # Build solution
      - name: Build Solution
        run: |
          msbuild SchoolERP_System.sln ^
          /p:Configuration=Release ^
          /p:DeployOnBuild=true ^
          /p:WebPublishMethod=FileSystem ^
          /p:publishUrl="${{ github.workspace }}\publish"

      # Verify publish output
      - name: List Published Files
        run: dir "${{ github.workspace }}\publish"

      # Deploy via FTP
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /wwwroot/gitaction/
