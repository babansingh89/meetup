name: Build and Deploy .NET Framework 4.8 DLL Only

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-2025

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # Step 1: Restore Packages
    - name: Restore Packages
      shell: powershell
      run: nuget restore SchoolERP_System.sln -Verbosity detailed

    # Step 2: Inject Crystal DLLs into the project's bin folder
    - name: Copy Missing DLLs to Bin
      shell: powershell
      run: |
        # We try creating both common paths to be safe
        if (!(Test-Path "SchoolERP_System\bin")) { New-Item -ItemType Directory -Force -Path "SchoolERP_System\bin" }
        if (!(Test-Path "bin")) { New-Item -ItemType Directory -Force -Path "bin" }
        
        Get-ChildItem -Path ".\packages" -Filter "*.dll" -Recurse | Where-Object { $_.Name -like "*Crystal*" } | ForEach-Object {
            if (Test-Path "SchoolERP_System\bin") { Copy-Item -Path $_.FullName -Destination "SchoolERP_System\bin\" -Force }
            if (Test-Path "bin") { Copy-Item -Path $_.FullName -Destination "bin\" -Force }
            Write-Host "Injected into bin: $_.Name"
        }

    # Step 3: Build the project and output to a dedicated bin directory
    - name: Build Project
      shell: powershell
      run: |
        # We compile the solution cleanly without overriding OutDir (avoids MSBuild Web bugs)
        msbuild "SchoolERP_System.sln" /p:Configuration=Release /p:Platform="Any CPU" /t:Clean,Build

    # Step 4: Dynamically locate and extract ONLY your main DLL
    - name: Isolate Project DLL for Deployment
      shell: powershell
      run: |
        # Create a clean deployment source folder
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\deploy_drop"
        
        # Look for your compiled DLL across common build locations
        $foundDll = Get-ChildItem -Path "." -Recurse -Filter "*.dll" | 
                    Where-Object { $_.DirectoryName -like "*bin\Release*" -and $_.Name -notlike "*Crystal*" -and $_.Name -notlike "*Microsoft*" -and $_.Name -notlike "*System*" } | 
                    Select-Object -First 1

        if ($foundDll) {
            Write-Host "Found your project DLL at: $($foundDll.FullName)"
            Write-Host "Copying to deployment drop folder as target asset..."
            Copy-Item -Path $foundDll.FullName -Destination "${{ github.workspace }}\deploy_drop\SchoolERP_System.dll" -Force
        } else {
            Write-Error "Could not isolate your project's compiled DLL in any bin/Release folder!"
            Write-Host "Here is everything found in the workspace to help debug:"
            Get-ChildItem -Recurse -Filter "*.dll" | Select-Object FullName
            exit 1
        }

    # Step 5: Deploy ONLY the isolated project DLL to IIS via FTP
    - name: Deploy DLL to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./deploy_drop/
        server-dir: ./gitaction/
        dangerous-clean-slate: false 
        # Since we renamed it to target_assembly.dll in Step 4, we only let this file pass through
        filter: |
          !**
          SchoolERP_System.dll
