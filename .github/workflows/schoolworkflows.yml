name: Build and Deploy .NET Framework 4.8 DLL Only

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-2025

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # Step 1: Restore Packages
    - name: Restore Packages
      shell: powershell
      run: nuget restore SchoolERP_System.sln -Verbosity detailed

    # Step 2: Verify Crystal Packages
    - name: Verify Packages
      shell: powershell
      run: |
        if (Test-Path ".\packages") {
          Get-ChildItem .\packages -Recurse | Where-Object { $_.Name -like "*Crystal*" }
        }

    # Step 3: Inject Crystal DLLs into the packages folder if needed
    - name: Copy Missing DLLs to Bin
      shell: powershell
      run: |
        if (!(Test-Path "SchoolERP_System\bin")) {
            New-Item -ItemType Directory -Force -Path "SchoolERP_System\bin"
        }
        Get-ChildItem -Path ".\packages" -Filter "*.dll" -Recurse | Where-Object { $_.Name -like "*Crystal*" } | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination "SchoolERP_System\bin\" -Force
            Write-Host "Injected into bin: $_.Name"
        }

    # Step 4: Build the Solution and FORCE output to a dedicated folder
    - name: Build Solution
      shell: powershell
      run: |
        msbuild "SchoolERP_System.sln" /p:Configuration=Release /p:Platform="Any CPU" /t:Clean,Build /p:OutDir="${{ github.workspace }}\build_output\\"

    # Step 5: Verify the specific Project DLL exists in our forced folder
    # Note: Replace 'SchoolERP_System.dll' with your exact DLL filename if your project assembly name is different
    - name: Show Compiled DLL
      shell: powershell
      run: |
        $dllPath = "${{ github.workspace }}\build_output\SchoolERP_System.dll"
        if (Test-Path $dllPath) {
          Write-Host "Success! Found compiled DLL:"
          Get-Item $dllPath
        } else {
          Write-Error "Project DLL not found at $dllPath! Printing everything found in build_output:"
          if (Test-Path "${{ github.workspace }}\build_output") { 
            Get-ChildItem "${{ github.workspace }}\build_output" -Filter "*.dll" 
          }
          exit 1
        }

    # Step 6: Deploy ONLY the specific project DLL to IIS via FTP
    - name: Deploy DLL to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./build_output/
        server-dir: ./gitaction/
        dangerous-clean-slate: false 
        filter: |
          !**
          SchoolERP_System.dll
