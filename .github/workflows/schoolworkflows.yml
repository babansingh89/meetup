name: Deploy .NET App to IIS

on:
  push:
    branches:
      - master        # ✅ Trigger on push to main branch
  workflow_dispatch: # ✅ Manual trigger option

jobs:
  build-and-deploy:
    runs-on: windows-latest  # ✅ Windows for IIS

    steps:
    # Step 1 - Checkout code
    - name: Checkout Code
      uses: actions/checkout@v3

    # Step 2 - Setup .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '4.8'  # ✅ Change to your .NET version

    # Step 3 - Restore packages
    - name: Restore NuGet Packages
      run: dotnet restore

    # Step 4 - Build application
    - name: Build Application
      run: dotnet build --configuration Release --no-restore

    # Step 5 - Publish application
    - name: Publish Application
      run: dotnet publish --configuration Release --output ./publish --no-build

    # Step 6 - Deploy to IIS using Web Deploy
    - name: Deploy to IIS
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: D:\CSG_PROJECT\Others\publishfile
        server-dir: /wwwroot/gitaction/
