name: Build and Deploy .NET Framework 4.8

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: windows-2025

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # ✅ Debug - Check folder structure
    - name: Check Folder Structure
      run: |
        Write-Host "Current directory:"
        Get-Location
        Write-Host "Files in root:"
        Get-ChildItem -Force
        Write-Host "Looking for .sln files:"
        Get-ChildItem -Recurse -Filter "*.sln"
      shell: powershell

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # ✅ Restore with full path
    - name: Restore Packages
      run: |
        $slnPath = Get-ChildItem -Recurse -Filter "*.sln" | Select-Object -First 1 -ExpandProperty FullName
        Write-Host "Found .sln at: $slnPath"
        nuget restore "$slnPath"
      shell: powershell

    - name: Build Solution
      run: |
        msbuild SchoolERP_System.sln `
          /p:Configuration=Release `
          /p:Platform="Any CPU"
      shell: powershell

    - name: Publish Website
      run: |
        msbuild SchoolERP_System\SchoolERP_System.csproj `
          /p:Configuration=Release `
          /p:DeployOnBuild=true `
          /p:WebPublishMethod=FileSystem `
          /p:DeleteExistingFiles=True `
          /p:publishUrl="${{ github.workspace }}\publish" `
          /p:UseShortNameDirectory=True
      shell: powershell

    - name: Show Published Files
      run: Get-ChildItem -Recurse "${{ github.workspace }}\publish"
      shell: powershell

    - name: Verify Publish Output
      run: |
        if (!(Test-Path "${{ github.workspace }}\publish")) {
          Write-Host "Publish folder not found!"
          exit 1
        }
        $files = Get-ChildItem "${{ github.workspace }}\publish" -Recurse
        Write-Host "Total files published: $($files.Count)"
      shell: powershell

    - name: Deploy to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /wwwroot/gitaction/
        timeout: 60000
        log-level: verbose
