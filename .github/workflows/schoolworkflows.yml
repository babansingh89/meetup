name: Build and Deploy .NET Framework 4.8

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-2025

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # ✅ Restore with detailed log
    - name: Restore Packages
      shell: powershell
      run: |
        $sln = Get-ChildItem -Recurse -Filter "*.sln" | Select-Object -First 1 -ExpandProperty FullName
        nuget restore "$sln" -Verbosity detailed

    # 🔥 IMPORTANT: Verify Crystal packages restored
    - name: Verify Crystal Packages
      shell: powershell
      run: |
        if (Test-Path ".\packages") {
          Get-ChildItem .\packages -Recurse | Where-Object { $_.Name -like "*Crystal*" }
        } else {
          Write-Host "Packages folder missing!"
          exit 1
        }

    - name: Build Solution
      shell: powershell
      run: |
        $sln = Get-ChildItem -Recurse -Filter "*.sln" | Select-Object -First 1 -ExpandProperty FullName
        msbuild "$sln" /p:Configuration=Release /p:Platform="AnyCPU"

    # 🔥 CRITICAL CHECK (THIS WILL SHOW REAL ISSUE)
    - name: Check Bin DLLs
      shell: powershell
      run: |
        $bin = Get-ChildItem -Recurse -Directory | Where-Object { $_.Name -eq "bin" } | Select-Object -First 1
        if ($bin) {
          Get-ChildItem $bin.FullName -Filter "CrystalDecisions*.dll"
        } else {
          Write-Host "BIN folder not found"
        }

    - name: Publish Website
      shell: powershell
      run: |
        $csproj = Get-ChildItem -Recurse -Filter "*.csproj" | Select-Object -First 1 -ExpandProperty FullName

        msbuild "$csproj" `
          /p:Configuration=Release `
          /p:DeployOnBuild=true `
          /p:WebPublishMethod=FileSystem `
          /p:DeleteExistingFiles=True `
          /p:Platform="AnyCPU" `
          /p:publishUrl="${{ github.workspace }}\publish"

    - name: Show Published Files
      shell: powershell
      run: |
        Get-ChildItem -Recurse "${{ github.workspace }}\publish"

    - name: Deploy to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /wwwroot/gitaction/
