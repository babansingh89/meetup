name: Build and Deploy .NET Framework 4.8

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-2025

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # Restore
    - name: Restore Packages
      shell: powershell
      run: nuget restore SchoolERP_System.sln -Verbosity detailed

    # Verify Crystal Packages
    - name: Verify Packages
      shell: powershell
      run: |
        if (Test-Path ".\packages") {
          Get-ChildItem .\packages -Recurse | Where-Object { $_.Name -like "*Crystal*" }
        }

    # Build (IMPORTANT FIX HERE)
    - name: Build Solution
      shell: powershell
      run: |
        msbuild "SchoolERP_System.sln" /p:Configuration=Release /p:Platform="Any CPU"

    # Publish FIXED (DO NOT auto-detect csproj)
    - name: Publish Website
      shell: powershell
      run: |
        msbuild "SchoolERP_System/SchoolERP_System.csproj" `
          /p:Configuration=Release `
          /p:Platform="Any CPU" `
          /p:DeployOnBuild=true `
          /p:WebPublishMethod=FileSystem `
          /p:DeleteExistingFiles=True `
          /p:publishUrl="${{ github.workspace }}\publish"

    # Verify output
    - name: Show Published Files
      shell: powershell
      run: Get-ChildItem -Recurse "${{ github.workspace }}\publish"

    # Deploy FTP
    - name: Deploy to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /wwwroot/gitaction/
