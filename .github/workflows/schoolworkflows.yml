name: Build and Deploy .NET Framework 4.8

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: windows-2025

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Check Folder Structure
      run: |
        Write-Host "=== Current directory ==="
        Get-Location
        Write-Host "=== Root files ==="
        Get-ChildItem -Force
        Write-Host "=== All .sln files ==="
        Get-ChildItem -Recurse -Filter "*.sln"
        Write-Host "=== All .csproj files ==="
        Get-ChildItem -Recurse -Filter "*.csproj"
        Write-Host "=== All packages.config files ==="
        Get-ChildItem -Recurse -Filter "packages.config"
      shell: powershell

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore Packages
      run: |
        $slnPath = Get-ChildItem -Recurse -Filter "*.sln" | Select-Object -First 1 -ExpandProperty FullName
        Write-Host "Restoring: $slnPath"
        nuget restore "$slnPath"
      shell: powershell

    - name: Build Solution
      run: |
        $slnPath = Get-ChildItem -Recurse -Filter "*.sln" | Select-Object -First 1 -ExpandProperty FullName
        Write-Host "Building: $slnPath"
        msbuild "$slnPath" /p:Configuration=Release /p:Platform="Any CPU"
      shell: powershell

    - name: Publish Website
      run: |
        $csprojPath = Get-ChildItem -Recurse -Filter "*.csproj" | Select-Object -First 1 -ExpandProperty FullName
        Write-Host "Publishing: $csprojPath"
        msbuild "$csprojPath" `
          /p:Configuration=Release `
          /p:DeployOnBuild=true `
          /p:WebPublishMethod=FileSystem `
          /p:DeleteExistingFiles=True `
          /p:publishUrl="${{ github.workspace }}\publish"
      shell: powershell

    - name: Show Published Files
      run: |
        if (Test-Path "${{ github.workspace }}\publish") {
          Get-ChildItem -Recurse "${{ github.workspace }}\publish"
        } else {
          Write-Host "Publish folder not found!"
          exit 1
        }
      shell: powershell

    - name: Deploy to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /wwwroot/gitaction/
        timeout: 60000
        log-level: verbose
